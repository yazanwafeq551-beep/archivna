<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none" role="img" aria-label="Arsheefna">
  <style>
    @keyframes draw { 0% { stroke-dashoffset: 600; } 100% { stroke-dashoffset: 0; } }
    @keyframes drawShort { 0% { stroke-dashoffset: 160; } 100% { stroke-dashoffset: 0; } }
    @keyframes sheetUp { 0% { opacity: 0; transform: translateY(14px); } 100% { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes bloom {
      0% { transform: scale(0.1); opacity: 0; }
      70% { transform: scale(1.12); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.82; } }
    .an-board { animation: draw 0.55s cubic-bezier(0.4,0,0.2,1) 0s both; }
    .an-sheet { opacity: 0; animation: sheetUp 0.4s cubic-bezier(0.34,1.2,0.64,1) both; }
    .an-arch { animation: drawShort 0.35s ease-out 0.62s both; }
    .an-alef { opacity: 0; animation: fadeIn 0.25s ease-out 0.75s both; }
    .an-hamza { opacity: 0; animation: fadeIn 0.2s ease-out 0.85s both; }
    .an-pix { opacity: 0; transform-box: fill-box; transform-origin: 50% 50%; animation: bloom 0.3s cubic-bezier(0.34,1.56,0.64,1) both; }
    .an-stem { animation: drawShort 0.3s ease-out 1.28s both; }
    .an-leaf { opacity: 0; transform-box: fill-box; transform-origin: 50% 50%; animation: bloom 0.3s cubic-bezier(0.34,1.56,0.64,1) both; }
    .an-fruit { opacity: 0; transform-box: fill-box; transform-origin: 50% 50%; animation: bloom 0.35s cubic-bezier(0.34,1.56,0.64,1) 1.56s both; }
    .an-name { opacity: 0; animation: fadeIn 0.6s ease-out 1.85s both; }
    .an-settle { animation: breathe 2.6s ease-in-out 2.6s infinite; }
  </style>
